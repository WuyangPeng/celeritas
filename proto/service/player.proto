syntax = "proto3";

package celeritas.proto.service;

message gateway_login_request {
    int64 account_id = 1;
    bool new_account = 2;
    string game_server_id = 3;
    string device_id = 4;
    string app_version = 5;
}

message service_player_request {
  oneof payload {
    gateway_login_request gateway_login = 1;
  }
}

