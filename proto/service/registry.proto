syntax = "proto3";

package celeritas.proto.service;

// 定义服务注册消息
message register_request {
  string service_name = 1;
  string instance_id = 2;
  string game_server_id = 3;
  string host = 4;
  int32 tcp_port = 5;
  int32 http_port = 6;
  int32 websock_port = 7;
  int32 tcp_ssl_port = 8;
  int32 https_port = 9;
  int32 webSocket_secure_port = 10;
}

// 定义服务发现消息
message discover_request {
  string service_name = 1;
}

message end_point {
    string host = 1;
    int32 port = 2;
}

message discover_response {
  repeated end_point endpoints = 1;
}

message service_registry_request {
  oneof payload {
    register_request server_register = 1;
    discover_request server_discover = 2;
  }
}

message service_registry_response {
  oneof payload {
    discover_response discover = 2;
  }
}