syntax = "proto3";

package celeritas.proto;

message client_message_header {
    int32 rpc = 1;
}

message server_message_header {
    int64 user_id = 1;
    int32 code = 2;
}

message header_request {
  oneof payload {
    client_message_header client = 1;
    server_message_header server = 2;
  }
}
 