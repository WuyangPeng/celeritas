syntax = "proto3";

package celeritas.proto.service;

import "proto/common/item.proto";

// 重载配置数据库
message reload_config_db_request {
  string db_name = 1;
  int64 id = 2;
}

message reload_config_db_response {
}

// 重载游戏数据库
message reload_game_config_request {
}

message reload_game_config_response {
}

message service_login_request {
    int64 account_id = 1;
    bool new_account = 2;
    int64 account_bind_id = 3;
    bool new_game_server_id = 4;
    string game_server_id = 5;
    string device_id = 6;
    string app_version = 7;
    int64 session_id = 8;
    int32 protocol = 9;
}

message service_login_response {
    int64 current_time = 1;
    int64 session_id = 2;
    int32 protocol = 3;
    string instance_id = 4;
}

message offline_request {
}

message server_mail_content_data {
    int32 type = 1;
    string content = 2;
}

message server_mail_data {
    int64 mail_id = 1;
    int32 type = 2;
    bool multilingual = 3;
    repeated server_mail_content_data title = 4;
    repeated server_mail_content_data content = 5;
    int64 send_time = 6;
    int64 expire_time = 7;
    repeated common.inventory_data attachments = 8;
}

// 发送全服邮件
message send_server_mail_request {
  server_mail_data mail = 1;
}

message send_server_mail_response {
}

message service_player_request {
  oneof payload {
    reload_config_db_request reload_config_db = 1;
    reload_game_config_request reload_game_config = 2;
    service_login_request service_login = 3;
    offline_request offline = 4;
    send_server_mail_request send_server_mail = 5;
  }
}

message service_player_response {
  oneof payload {
    reload_config_db_response reload_config_db = 1;
    reload_game_config_response reload_game_config = 2;
    service_login_response service_login = 3;
    send_server_mail_response send_server_mail = 5;
  }
}

