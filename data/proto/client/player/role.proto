syntax = "proto3";

package celeritas.proto.client;

message role_response {
    string surname = 1;
    string name = 2;
    bool modify_name = 3;
    int32 change_count = 4;
    int32 per_day_change_count = 5;
}

message change_role_name_request {
    string surname = 1;
    string name = 2;
}

message client_role_request {
  oneof payload {
    change_role_name_request change_role_name = 1;
  }
}

message client_role_response {
  oneof payload {
    role_response role = 1;
  }
}
