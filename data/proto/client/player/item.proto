syntax = "proto3";

package celeritas.proto.client;

message custom_data {
}

message consumable_data {
    int64 expire_time = 1;
}

message equipment_data {
    int32 strength = 1;
    int32 durability = 2;
}

message avatar_data {
}

message frame_data {
}

message title_data {
}

message hero_data {
}

message inventory_data {
    int64 item_id = 1;
    int32 template_id = 2;
    int64 count = 3;
    int32 position = 4;
    oneof payload {
        custom_data custom = 5;
        consumable_data consumable = 6;
        equipment_data equipment = 7;
        avatar_data avatar = 8;
        frame_data frame = 9;
        title_data title = 10;
        hero_data hero = 11;
    }
}

message item_delete_data  {
    int64 item_id = 1;
    int32 template_id = 2;
}

message item_selected_data {
    int64 id = 1;
    int32 item_type = 2;
    int32 child_type = 3;
    int64 operation_id = 4;
    int32 parameter = 5;
    int64 selected_id = 6;
}

message item_response {
    repeated inventory_data inventory = 1;
    bool is_login = 2;
}

message item_delete_response {
    repeated item_delete_data data = 1;
}

message item_selected_request {
    item_selected_data item_selected = 1;
}

message item_selected_response {
    repeated item_selected_data item_selected = 1;
    bool is_login = 2;
}

message client_item_request {
  oneof payload {
    item_selected_request item_selected = 1;
  }
}

message client_item_response {
  oneof payload {
    item_response item = 1;
    item_delete_response item_delete = 2;
    item_selected_response item_selected = 3;
  }
}
