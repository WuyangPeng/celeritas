syntax = "proto3";

package celeritas.proto.common;

message custom_data {
}

message consumable_data {
    int64 expire_time = 1;
}

message equipment_data {
    int32 strength = 1;
    int32 durability = 2;
}

message avatar_data {
}

message frame_data {
}

message title_data {
}

message hero_data {
}

message exp_data {
}

message building_data {
    int32 level = 1;
}

message resource_data {
}

message soldier_data {
}

message machine_data {
}

message skill_book_data {
}

message blueprint_data {
}

message gift_box_data {
}

message treasure_data {
}

message inventory_data {
    int64 item_id = 1;
    int32 template_id = 2;
    int64 count = 3;
    int32 position = 4;
    bool is_locked = 5;
    oneof payload {
        custom_data custom = 6;
        consumable_data consumable = 7;
        equipment_data equipment = 8;
        avatar_data avatar = 9;
        frame_data frame = 10;
        title_data title = 11;
        hero_data hero = 12;
        exp_data exp = 13;
        building_data building = 14;
        resource_data resource = 15;
        soldier_data soldier = 16;
        machine_data machine = 17;
        skill_book_data skill_book = 18;
        blueprint_data blueprint = 19;
        gift_box_data gift_box = 20;
        treasure_data treasure = 21;
    }
}